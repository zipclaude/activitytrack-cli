# CI of activitytrack-cli on GitLab (free plan: the shared runners' minutes are limited, so
# pipelines run for merge requests, the default branch and tags). A tag vX.Y.Z builds
# the Debian/Ubuntu packages, the tarball and the Windows executable, tries them and
# publishes the release. "Run pipeline" by hand does everything but publishing.
# The library is python3-activitytrack at the tag in .gitlab/lib-ref.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [test, package, release]

default:
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive
  LIB_URL: https://gitlab.com/infraconsulting/python3-activitytrack

linux:
  stage: test
  # the distributions' packages only: the oldest and the newest of the targets
  image: $IMAGE
  parallel:
    matrix:
      - IMAGE: ["debian:trixie", "debian:forky", "ubuntu:24.04"]
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates python3 python3-cryptography python3-keyring flake8
    # the library (python3-activitytrack at .gitlab/lib-ref)
    - git clone --depth 1 -b "$(cat .gitlab/lib-ref)" "$LIB_URL" lib
    - export PYTHONPATH="$PWD/lib"
    - flake8 activitytrack_cli tests packaging/activitytrack
    - python3 scripts/strings.py --check
    - python3 -m unittest discover -s tests -t . -v

windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  script:
    - choco install python313 --no-progress -y
    - $env:Path = "C:\Python313;C:\Python313\Scripts;" + $env:Path
    # the versions the executable bundles (requirements-windows.txt)
    - python -m pip install -r requirements-windows.txt
    - $lib = (Get-Content .gitlab/lib-ref).Trim()
    - python -m pip install -c requirements-windows.txt "git+$env:LIB_URL@$lib"
    - python -m unittest discover -s tests -t . -v

# the packages are tried on a tag, by hand, and in merge requests that touch the packaging
.packaging:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["debian/**/*", "packaging/**/*", "requirements-*.txt", ".gitlab-ci.yml"]

deb:
  extends: .packaging
  stage: package
  image: $IMAGE
  parallel:
    matrix:
      - { IMAGE: "debian:trixie", SUFFIX: deb13 }
      - { IMAGE: "debian:forky", SUFFIX: deb14 }
      - { IMAGE: "ubuntu:24.04", SUFFIX: ubuntu24.04 }
      - { IMAGE: "ubuntu:26.04", SUFFIX: ubuntu26.04 }
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper dpkg-dev devscripts equivs man-db
    # version
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_cli/__init__.py)
    # a release is built on a released library
    - if [ -n "$CI_COMMIT_TAG" ]; then test "v$V" = "$CI_COMMIT_TAG"; grep -q "^v" .gitlab/lib-ref; fi
    # only the first "-": 0.9.4-beta5-1 is 0.9.4~beta5-1
    - DV=$(echo "$V" | sed 's/-/~/')
    # the package: that version and a Debian revision, 1.1.0~beta.1-1
    - PV=$(dpkg-parsechangelog -S Version)
    - test "$(dpkg-parsechangelog -S Source)" = activitytrack-cli && test "${PV%-*}" = "$DV" && test "$PV" != "$DV"
    - grep -q "activitytrack $V" packaging/activitytrack.1
    # the distribution goes in the revision: 1.1.0~beta.1-1~deb13 still satisfies (>= 1.1.0~beta.1)
    - sed -i "1s/($PV)/($PV~$SUFFIX)/" debian/changelog
    - head -1 debian/changelog
    # the library's package (python3-activitytrack at .gitlab/lib-ref)
    - git clone --depth 1 -b "$(cat .gitlab/lib-ref)" "$LIB_URL" /tmp/lib
    - cd /tmp/lib
    # versioned as in its release (1.1.0~beta.1-1~deb13): the Depends are tried on that
    - sed -i "1s/(\([^)]*\))/(\1~$SUFFIX)/" debian/changelog
    - mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
    - dpkg-buildpackage -b -us -uc
    - apt-get install -y /tmp/python3-activitytrack_*.deb
    - cd "$CI_PROJECT_DIR"
    # package
    - dpkg-buildpackage -b -us -uc
    - mkdir dist && mv ../activitytrack-cli_*.deb dist/
    - dpkg-deb --info dist/*.deb
    - dpkg-deb --contents dist/*.deb
    - apt-get install -y ./dist/*.deb
    # try it
    - activitytrack --version
    - man -w activitytrack
    - D=$(mktemp -d)
    - activitytrack --data "$D" --no-sync start Prova -c Cliente
    - |
      activitytrack --data "$D" --json status | grep -q '"label": "Cliente · Prova"'
    # the tests against the installed code, not the checkout's
    - mkdir /tmp/t && cp -r tests /tmp/t/ && cd /tmp/t
    - PYTHONPATH=/usr/share/activitytrack-cli python3 -m unittest discover -s tests -t . -v
    - cd "$CI_PROJECT_DIR"
    # remove
    - apt-get purge -y activitytrack-cli
    - test ! -e /usr/share/activitytrack-cli && test ! -e /usr/bin/activitytrack
  artifacts:
    paths: ["dist/*.deb"]
    expire_in: 30 days

tarball:
  extends: .packaging
  stage: package
  image: debian:trixie
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' activitytrack_cli/__init__.py)
    - mkdir dist
    - git archive --prefix="activitytrack-cli-$V/" -o "dist/activitytrack-cli-$V.tar.gz" HEAD
  artifacts:
    paths: ["dist/*.tar.gz"]
    expire_in: 30 days

windows-exe:
  extends: .packaging
  stage: package
  # one executable for the console, not signed (no costs: desktop's D10)
  tags: [saas-windows-medium-amd64]
  timeout: 30m
  script:
    - choco install python313 --no-progress -y
    - $env:Path = "C:\Python313;C:\Python313\Scripts;" + $env:Path
    - python -m pip install -r requirements-windows.txt -r requirements-build-windows.txt
    - $lib = (Get-Content .gitlab/lib-ref).Trim()
    - python -m pip install -c requirements-windows.txt "git+$env:LIB_URL@$lib"
    # installed, so that PyInstaller finds its data files (the translations)
    - python -m pip install --no-deps .
    - $V = (Select-String -Path activitytrack_cli/__init__.py -Pattern '^__version__ = "(.*)"').Matches[0].Groups[1].Value
    - if ($env:CI_COMMIT_TAG -and "v$V" -ne $env:CI_COMMIT_TAG) { throw "tag $env:CI_COMMIT_TAG, version $V" }
    - python -m unittest discover -s tests -t .
    - |
      pyinstaller --noconfirm --clean --onefile --console --name activitytrack --paths . `
        --collect-submodules keyring.backends --collect-data tzdata `
        --collect-submodules activitytrack --collect-data activitytrack --collect-data activitytrack_cli `
        packaging/windows-launcher.py
    # the output read as UTF-8 (the console's code page would garble «·»)
    - $env:PYTHONIOENCODING = "utf-8"
    - '[Console]::OutputEncoding = [System.Text.Encoding]::UTF8'
    - .\dist\activitytrack.exe --version
    - $d = New-Item -ItemType Directory -Path "$env:TEMP\at"
    - .\dist\activitytrack.exe --data $d --no-sync start Prova -c Cliente
    - $s = .\dist\activitytrack.exe --data $d --json status | Out-String
    - |
      if ($s -notmatch '"client": "Cliente"' -or $s -notmatch '"activity": "Prova"') { throw "status: $s" }
    # the translations are in the bundle: the runner's Windows is in English
    - $t = .\dist\activitytrack.exe --data $d status | Out-String
    - |
      if ($t -notmatch "Not paired") { throw "texts: $t" }
    # pause writes to stderr: tolerated here (PowerShell 5.1 of the runner stops on it), only its text is read
    - |
      $ErrorActionPreference = "Continue"
      $e = (& .\dist\activitytrack.exe --data $d --no-sync pause 2>&1 | Out-String)
      if ($e -match "Attenzione") { throw "the command line's texts not translated: $e" }
      $true
    - New-Item -ItemType Directory -Path pack | Out-Null
    - Copy-Item dist/activitytrack.exe, LICENSE, README.md pack/
    - Compress-Archive -Path pack/* -DestinationPath "dist/activitytrack-cli-$V-windows.zip"
  artifacts:
    paths: ["dist/activitytrack-cli-*-windows.zip"]
    expire_in: 30 days

# the files go to the project's Generic Packages and the release links them
# (permalinks .../-/releases/<tag>/downloads/<file>); a version with a suffix is a beta
release:
  stage: release
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  interruptible: false
  script:
    - apk add --no-cache curl jq coreutils
    - V="${CI_COMMIT_TAG#v}"
    - PV=$(sed -n '1s/^[^(]*(\(.*\)).*/\1/p' debian/changelog)
    - R="${PV##*-}"
    - LIB=$(cat .gitlab/lib-ref)
    # "~" of the package versions is not allowed in a package file's name: "-" instead
    - mkdir artifacts && cp dist/*.deb dist/*.tar.gz dist/*.zip artifacts/
    - cd artifacts
    - for f in activitytrack-cli_*~*_all.deb; do mv "$f" "$(echo "$f" | tr '~' '-')"; done
    - sha256sum * > SHA256SUMS && cat SHA256SUMS
    - cd ..
    - |
      {
        case "$V" in *-*) echo "activitytrack-cli $V: a test release." ;; *) echo "activitytrack-cli $V." ;; esac
        echo
        echo "ActivityTrack from the command line: the same application as ActivityTrack Desktop, on the same data and pairing."
        echo
        echo "- Debian 13 / 14, Ubuntu 24.04 / 26.04: \`apt install ./python3-activitytrack_*-<distro>_all.deb ./activitytrack-cli_${V}-${R}-<distro>_all.deb\`; the library [python3-activitytrack]($LIB_URL/-/releases/$LIB) is in its own release"
        echo "- Windows 10 / 11: `activitytrack-cli-$V-windows.zip`: `activitytrack.exe`, to put in a folder of the PATH. Not signed: check it against SHA256SUMS"
        echo "- Elsewhere: \`pip install activitytrack-cli-$V.tar.gz\` after the library"
      } > notes.md
    - |
      links='[]'
      for f in artifacts/*; do
        n=$(basename "$f")
        u="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/activitytrack-cli/$V/$n"
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$u"
        links=$(echo "$links" | jq -c --arg n "$n" --arg u "$u" '. + [{name:$n, url:$u, direct_asset_path:("/"+$n), link_type:"package"}]')
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "activitytrack-cli $V" --rawfile desc notes.md --argjson links "$links" \
        '{tag_name:$tag, name:$name, description:$desc, assets:{links:$links}}' |
        curl --fail-with-body -sS -X POST --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
